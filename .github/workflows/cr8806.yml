name: CR8806 build

# Chay tay (Actions > CR8806 build > Run workflow) -> chi build, file nam trong
# Artifacts cua lan chay. Push tag cr8806-* -> build va tao GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "cr8806-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('cr8806/diffconfig', 'include/kernel-*') }}
          restore-keys: dl-

      - name: Build
        run: ./cr8806/build.sh

      - name: Collect images
        run: |
          mkdir out
          cd bin/targets/qualcommax/ipq50xx
          cp *cr8806* ../../../../out/
          cd ../../../../out
          sha256sum * > sha256sums
          cat sha256sums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cr8806-${{ github.sha }}
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/cr8806-')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            OpenWrt cho Xiaomi CR8806 (M79), commit ${{ github.sha }}.
            Cach cai dat va kiem tra: xem cr8806/README.md.
            - initramfs-uImage.itb: boot thu qua TFTP (khong ghi flash)
            - squashfs-factory.ubi: ghi vao slot rootfs / rootfs_1 tu firmware Xiaomi
            - squashfs-sysupgrade.bin: nang cap tu OpenWrt dang chay
